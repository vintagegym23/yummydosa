# AWS Amplify Hosting build spec (static SPA: Vite + React).
# Amplify picks this file up automatically from the repo root.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pin the Node major the project is developed/tested on (see .nvmrc).
        - nvm install 22 && nvm use 22
        - node --version && npm --version
        # Clean, lockfile-exact install; the local .npm folder is cached between builds.
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        # Typecheck + asset integrity check: fails the build (and keeps the
        # previous deploy live) if code or asset references are broken.
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
